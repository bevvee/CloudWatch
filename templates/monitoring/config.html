{% extends 'monitoring/base.html' %}{% block title %}Configuration{% endblock %}{% block content %}<section class="panel settings-panel"><h3>Seuils de surveillance</h3><p class="muted">Seuls les administrateurs peuvent modifier les seuils.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" class="settings-form">{% csrf_token %}<label>Température minimale (°C)<input type="number" step="0.1" name="min_temp" value="{{ config.min_temp }}" required></label><label>Température maximale (°C)<input type="number" step="0.1" name="max_temp" value="{{ config.max_temp }}" required></label><label>Détection de panne réseau (minutes)<input type="number" min="1" max="10080" name="stale_minutes" value="{{ config.stale_minutes }}" required></label><button class="primary">Enregistrer les paramètres</button></form></section>{% endblock %}
